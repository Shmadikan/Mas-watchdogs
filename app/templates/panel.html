<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Claude Style — Панели</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, 'Helvetica Neue', sans-serif;
            background: #f9f9f8;
            color: #1a1a1a;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
        }

        .sidebar {
            width: 280px;
            background-color: #ffffff;
            border-right: 1px solid #eaeaea;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 2rem 1rem;
            gap: 1.25rem;
            box-shadow: 0 0 0 rgba(0,0,0,0.02);
            flex-shrink: 0;
        }

        .panel-btn {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
            padding: 1.5rem 1.25rem;
            background: #ffffff;
            border: 1px solid #e8e8e8;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-size: 1.25rem;
            font-weight: 500;
            color: #1e2a3a;
            box-shadow: 0 1px 1px rgba(0,0,0,0.02);
        }

        .panel-btn:hover {
            background-color: #f5f5f2;
            border-color: #d0d0d0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            transform: translateY(-1px);
        }

        .panel-btn:active {
            transform: translateY(1px);
            background-color: #efefeb;
        }

        .icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #3c3c3c;
        }

        .btn-text {
            flex: 1;
            letter-spacing: -0.2px;
        }

        .panel-btn:focus-visible {
            outline: 2px solid #7c7c7a;
            outline-offset: 2px;
        }

        .content-wrapper {
            display: flex;
            flex: 1;
            min-height: 100vh;
        }

        .list-panel {
            width: 380px;
            background: #ffffff;
            border-right: 1px solid #eaeaea;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .list-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: #1e2a3a;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .data-scroll {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .data-row {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            padding: 0.75rem;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            background: #fafaf9;
            font-size: 0.85rem;
        }

        .data-row span {
            color: #3a3a3a;
        }

        .data-row .label {
            font-size: 0.7rem;
            color: #9a9a9a;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .run-btn {
            background: #2d8a4e;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
            align-self: flex-start;
            margin-top: 0.25rem;
        }

        .run-btn:hover {
            background: #236d3e;
        }

        .run-btn:active {
            background: #1c5a31;
        }

        .main-area {
            flex: 1;
            background: #f9f9f8;
            min-height: 100vh;
            padding: 2rem 2.5rem;
        }

        .greeting {
            color: #3a3a3a;
            font-size: 0.95rem;
            font-weight: 400;
            opacity: 0.65;
            pointer-events: none;
            user-select: none;
        }

        @media (max-width: 550px) {
            .sidebar {
                width: 240px;
                padding: 1.25rem 0.75rem;
            }
            .panel-btn {
                padding: 1rem 1rem;
                font-size: 1rem;
            }
            .icon {
                width: 28px;
                height: 28px;
            }
            .list-panel {
                width: 280px;
                padding: 1rem;
            }
            .main-area {
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <button class="panel-btn" id="auditorBtn" onclick="window.location.href='{% url 'auditor' %}'">
        <span class="icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7zM9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1z" fill="currentColor"/>
                <circle cx="12" cy="9" r="2" fill="white" stroke="currentColor" stroke-width="1.2"/>
            </svg>
        </span>
        <span class="btn-text">Аудитор</span>
    </button>

    <button class="panel-btn" id="coordinatorBtn">
        <span class="icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 9c-2.7 0-5.8 1.29-6 2h12c-.2-.71-3.3-2-6-2z" fill="currentColor"/>
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.2" fill="white"/>
                <path d="M17 7l2 2-5 5-3-3-4 4" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
            </svg>
        </span>
        <span class="btn-text">Координатор</span>
    </button>

    <button class="panel-btn" id="settingsBtn">
        <span class="icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.33-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.38.12-.56l-1.89-3.28c-.12-.19-.36-.26-.56-.18l-2.39.96c-.5-.38-1.06-.68-1.66-.88L14.45 3.5c-.04-.2-.2-.34-.4-.34h-3.78c-.2 0-.36.14-.4.34l-.3 2.52c-.6.2-1.16.5-1.66.88l-2.39-.96c-.2-.08-.44 0-.56.18l-1.89 3.28c-.12.19-.07.42.12.56l2.03 1.58c-.04.3-.06.61-.06.94 0 .33.02.64.06.94l-2.03 1.58c-.18.14-.23.38-.12.56l1.89 3.28c.12.19.36.26.56.18l2.39-.96c.5.38 1.06.68 1.66.88l.3 2.52c.04.2.2.34.4.34h3.78c.2 0 .36-.14.4-.34l.3-2.52c.6-.2 1.16-.5 1.66-.88l2.39.96c.2.08.44 0 .56-.18l1.89-3.28c.12-.19.07-.42-.12-.56l-2.03-1.58zM12 15c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z" fill="currentColor"/>
            </svg>
        </span>
        <span class="btn-text">Настройки</span>
    </button>
</div>

<div class="content-wrapper">
    <div class="list-panel">
        <div class="list-title">IP Пулы</div>
        <div class="data-scroll">
            {% for pool in ip_pools %}
            <div class="data-row">
                <span class="label">IP</span>
                <span>{{ pool.ip }}</span>
                <span class="label">Description</span>
                <span>{{ pool.description }}</span>
                <span class="label">Mask</span>
                <span>{{ pool.mask }}</span>
                <button class="run-btn" onclick="alert('Запущено: {{ pool.ip }}')">Запустить</button>
            </div>
            {% empty %}
            <div class="data-row" style="text-align:center; color:#9a9a9a;">Нет данных</div>
            {% endfor %}
        </div>
    </div>

    <div class="main-area">
        <div class="greeting">● Интерфейс в стиле Claude</div>
    </div>
</div>

<script>
    (function() {
        const coordinator = document.getElementById('coordinatorBtn');
        const settings = document.getElementById('settingsBtn');

        if (coordinator) {
            coordinator.addEventListener('click', () => {
                alert('Координатор');
            });
        }
        if (settings) {
            settings.addEventListener('click', () => {
                alert('Настройки');
            });
        }
    })();
</script>
</body>
</html>
