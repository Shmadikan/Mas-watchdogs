<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .form-card {
            max-width: 480px;
            margin: 2rem auto;
        }
    </style>
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><a href="{% url 'profiles_view' %}">&larr; Back</a></li>
            </ul>
        </nav>
        <article class="form-card">
            <header>
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--pico-primary);">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <h2>Create Profile</h2>
            </header>
            <form action="" method="post">
                {% csrf_token %}
                <label>
                    Username
                    {{ form.username }}
                </label>
                <footer>
                    <button type="submit">Отправить</button>
                </footer>
            </form>
        </article>
    </main>
</body>
</html>
