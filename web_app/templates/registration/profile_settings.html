{% extends "base.html" %}
{% block title %}Profile Settings{% endblock %}
{% block content %}
    <main class="container">
        <nav>
            <ul>
                <li><a href="{% url 'control_page' %}">&larr; Back</a></li>
            </ul>
        </nav>
        <article class="form-card">
            <header>
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--pico-primary);">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <h2>Profile Settings</h2>
            </header>
            <form method="post" action="">
                {% csrf_token %}
                <label>
                    Language
                    <select name="language">
                        <option value="eng">eng</option>
                        <option value="rus">rus</option>
                    </select>
                </label>
                <label>
                    Theme color
                    <select name="color">
                        <option value="default">default</option>
                        <option value="dark">dark</option>
                        <option value="forest">forest</option>
                        <option value="ocean">ocean</option>
                    </select>
                </label>
                <label>
                    Polling interval
                    <div class="pooling-row">
                        <input type="range" name="pooling" id="pooling" min="1" max="30" value="2" step="1">
                        <output id="pooling-value">2s</output>
                    </div>
                </label>

                <footer>
                    <button type="submit">Save</button>
                </footer>
            </form>
        </article>
    </main>
{% endblock %}
{% block scripts %}
    <script>

        const colorPreview = document.getElementById('color-preview');
        const poolingSlider = document.getElementById('pooling');
        const poolingOutput = document.getElementById('pooling-value');



        poolingSlider.addEventListener('input', function () {
            poolingOutput.textContent = this.value + 's';
        });
    </script>
{% endblock %}
